services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: travel_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tib-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      target: runtime
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8081:8080"
    env_file:
      - ./env/dev.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: travel_dev
      DB_USER: postgres
      DB_PASSWORD: password
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@tib.local
      BASE_URL: http://localhost:8081
    volumes:
      - ../:/workspace   # optional: for live code refresh if using spring-boot-devtools

volumes:
  db-data:
