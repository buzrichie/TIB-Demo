services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: travel_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - db-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d travel_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    tmpfs:
      - /tmp
    shm_size: 128mb

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: test
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: travel_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travel_test
      SPRING_DATASOURCE_USERNAME: test_user
      SPRING_DATASOURCE_PASSWORD: test_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: false
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_AMALITECH: INFO
      # Required application secrets (from workflow environment)
      JWT_SECRET: ${JWT_SECRET:-dGVzdGp3dHNlY3JldGtleWZvcmNpb25seXRlc3Rqd3RzZWNyZXRrZXlmb3JjaW9ubHk=}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      BASE_URL: ${BASE_URL:-http://localhost:8081}
      SERVER_PORT: 8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-test-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-test-google-secret}
      MAIL_USER: ${MAIL_USER:-test@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-test-mail-password}
      ACCESS_KEY_ID: ${ACCESS_KEY_ID:-test-access-key}
      SECRET_ACCESS_KEY: ${SECRET_ACCESS_KEY:-test-secret-key}
      ACCESS_SECRET_KEY: ${ACCESS_SECRET_KEY:-test-secret-key}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-test-bucket}
      AWS_S3_BUCKET_REGION: ${AWS_S3_BUCKET_REGION:-us-east-1}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-Admin@123Test}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@test.com}
      POSTGRES_URL: jdbc:postgresql://db:5432/travel_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    tmpfs:
      - /tmp

volumes:
  db-test-data:
    driver: local
